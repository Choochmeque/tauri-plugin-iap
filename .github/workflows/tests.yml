name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --lcov --output-path coverage.lcov

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.lcov
          flags: rust
          name: rust-coverage

  test-js:
    name: JavaScript/TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage-final.json
          flags: javascript
          name: javascript-coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: js-coverage
          path: coverage/

  test-android:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Default "tools platform-tools" requests the retired `tools` package
          packages: platform-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Android bindings
        run: cargo build --target aarch64-linux-android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android unit tests with coverage
        run: |
          cd android
          ./gradlew clean testDebugUnitTest createDebugUnitTestCoverageReport --stacktrace --no-daemon

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./android/build/reports/coverage/test/debug/report.xml
          flags: android
          name: android-coverage
          root_dir: ${{ github.workspace }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results
          path: android/build/test-results/

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-coverage
          path: android/build/reports/coverage/test/debug/

  test-android-instrumented:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Default "tools platform-tools" requests the retired `tools` package
          packages: platform-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Android bindings
        run: cargo build --target aarch64-linux-android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew clean connectedDebugAndroidTest createDebugAndroidTestCoverageReport --stacktrace --no-daemon

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./android/build/reports/coverage/androidTest/debug/report.xml
          flags: android-instrumented
          name: android-instrumented-coverage
          root_dir: ${{ github.workspace }}

      - name: Upload instrumented test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-instrumented-test-results
          path: android/build/outputs/androidTest-results/

      - name: Upload instrumented coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-instrumented-coverage
          path: android/build/reports/coverage/androidTest/debug/

  test-ios:
    name: iOS Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode 26.2 (iOS 26.2 simulator runtime)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build iOS bindings
        run: cargo build --target aarch64-apple-ios

      - name: Run iOS unit tests
        run: |
          cd ios
          xcodebuild test \
            -scheme tauri-plugin-iap \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Generate coverage report
        run: |
          cd ios
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./ios/coverage.json
          flags: ios
          name: ios-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-coverage
          path: ios/coverage.json

  test-macos:
    name: macOS Unit Tests (${{ matrix.runs-on }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest still defaults to SwiftPM's native backend; xcode-27
        # defaults to swiftbuild. Both write a static archive, in different
        # places, so running both keeps each default layout covered.
        runs-on: [macos-latest, xcode-27]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build macOS bindings
        run: cargo build --target aarch64-apple-darwin

      - name: Build macOS bindings (release)
        run: cargo build --release --target aarch64-apple-darwin

      # An rlib build cannot fail on undefined symbols, so assert directly that
      # the archive handed to the linker exports every swift-bridge entry
      # point. This is the check for the release symbol-visibility regression.
      - name: Check swift-bridge symbols are exported
        run: |
          set -euo pipefail
          # Ask cargo which OUT_DIR the build script used, so the right
          # `output` file is read even when stale ones are on disk.
          out_dir=$(cargo build --release --target aarch64-apple-darwin --message-format=json \
            | jq -r 'select(.reason=="build-script-executed" and (.package_id|test("tauri-plugin-iap")))|.out_dir' \
            | tail -1)
          # Only if cargo reported no build-script message, fall back to the
          # newest matching output file.
          if [ -n "$out_dir" ] && [ -f "$out_dir/../output" ]; then
            out="$out_dir/../output"
          else
            out=$(ls -t target/aarch64-apple-darwin/release/build/tauri-plugin-iap-*/output | head -1)
          fi
          dir=$(grep -h 'rustc-link-search=native=' "$out" | tail -1 | sed 's/.*native=//')
          lib="$dir/libtauri-plugin-iap.a"
          if [ ! -f "$lib" ]; then echo "no archive at $lib"; exit 1; fi
          echo "checking $lib"
          nm -gU -arch arm64 "$lib" | awk '$2=="T"{print $3}' | sort -u > exported.txt
          grep -rhoE '@_cdecl\("[^"]+"\)' macos/Sources/generated --include='*.swift' \
            | sed 's/@_cdecl("//; s/")//' | sort -u > expected.txt
          count=$(wc -l < expected.txt | tr -d " ")
          if [ "$count" -eq 0 ]; then echo "no @_cdecl entry points found - generator changed?"; exit 1; fi
          missing=0
          while IFS= read -r name; do
            if ! grep -Fx -- "_$name" exported.txt > /dev/null; then
              echo "missing export: $name"; missing=1
            fi
          done < expected.txt
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "all $count swift-bridge entry points exported"

      - name: Run macOS unit tests
        run: |
          cd macos
          xcodebuild test \
            -scheme tauri-plugin-iap \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Generate coverage report
        run: |
          cd macos
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' && matrix.runs-on == 'macos-latest' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./macos/coverage.json
          flags: macos
          name: macos-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-test-results-${{ matrix.runs-on }}
          path: macos/TestResults.xcresult

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-coverage-${{ matrix.runs-on }}
          path: macos/coverage.json
